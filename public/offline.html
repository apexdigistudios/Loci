<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Déloci</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #facc15;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f5;
        --card-bg: #ffffff;
        --text: #09090b;
        --text-muted: #71717a;
      }
    }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem 1.5rem;
      border-radius: 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      margin: 0.5rem 0;
    }
    p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }
    button {
      background-color: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 0.85rem;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 1rem;
      width: 100%;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are Offline</h1>
    <p>Déloci needs an internet connection to sync live location updates and alerts with your circle.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
